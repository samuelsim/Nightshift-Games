name: Keep Nightshift awake

on:
  schedule:
    # Offset from the top of the hour, when GitHub's queue is busiest.
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/keep-awake.yml']

permissions: {}

concurrency:
  group: keep-nightshift-awake
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Request the live health endpoint
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            --connect-timeout 15 --max-time 90 \
            --retry 2 --retry-delay 5 --retry-max-time 180 \
            https://nightshift-games.onrender.com/health \
            --output /tmp/nightshift-health.json
          jq -e '.ok == true and .service == "nightshift-game-server"' /tmp/nightshift-health.json
